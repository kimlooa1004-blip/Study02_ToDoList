<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 관리</title>
<meta name="description" content="하루 10~20개의 할 일을 관리하는 개인용 할 일 목록">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9C%85%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f4f5f7;
    color: #1f2937;
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  h1 { font-size: 22px; margin: 0 0 16px; }

  .notice {
    margin: 0 0 12px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #fef3c7;
    color: #78350f;
    font-size: 14px;
  }
  .notice[hidden] { display: none; }

  .add-form { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-form input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
  }
  .add-form select {
    padding: 10px 8px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
  }
  .add-form button {
    padding: 10px 16px;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .add-form button:hover { background: #1d4ed8; }
  :focus-visible { outline: 3px solid #93c5fd; outline-offset: 1px; }

  .todo-list { list-style: none; margin: 0; padding: 0; background: #fff; border-radius: 10px; }
  .todo-list li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid #e5e7eb;
  }
  .todo-list li:last-child { border-bottom: 0; }
  .todo-check { flex: none; width: 18px; height: 18px; margin: 0; cursor: pointer; accent-color: #2563eb; }
  .todo-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .todo-list li.done .todo-text { text-decoration: line-through; color: #6b7280; }
  .todo-list li.done .badge { opacity: 0.6; }

  .delete-btn {
    flex: none;
    padding: 4px 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    background: #fff;
    color: #374151;
    font-size: 13px;
    cursor: pointer;
  }
  .delete-btn:hover { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }

  .todo-list li:not(.editing):hover { background: #f9fafb; }
  .todo-text { cursor: text; }

  /* 편집 모드: 일반 줄과 높이가 크게 달라지지 않게 위아래 여백을 줄인다 */
  .todo-list li.editing { gap: 6px; padding-top: 9px; padding-bottom: 9px; background: #eff6ff; }
  .edit-input {
    flex: 1 1 0;
    min-width: 0;
    padding: 6px 8px;
    border: 1px solid #93c5fd;
    border-radius: 6px;
    font-size: 15px;
    background: #fff;
  }
  .edit-category {
    flex: none;
    padding: 6px 4px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
  }
  .save-btn, .cancel-btn {
    flex: none;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .save-btn { border: 1px solid #2563eb; background: #2563eb; color: #fff; }
  .save-btn:hover { background: #1d4ed8; }
  .cancel-btn { border: 1px solid #d1d5db; background: #fff; color: #374151; }
  .cancel-btn:hover { background: #f3f4f6; }

  .badge {
    flex: none;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.work     { background: #dbeafe; color: #1e40af; }
  .badge.personal { background: #dcfce7; color: #166534; }
  .badge.study    { background: #ede9fe; color: #5b21b6; }

  .empty { padding: 28px 14px; text-align: center; color: #6b7280; }

  .progress {
    margin: 0 0 16px;
    padding: 14px;
    border-radius: 10px;
    background: #fff;
  }
  .progress-label { font-size: 15px; font-weight: 600; }
  .progress-bar {
    height: 10px;
    margin: 8px 0;
    border-radius: 999px;
    background: #e5e7eb;
    overflow: hidden;
  }
  .progress-fill { height: 100%; background: #2563eb; }
  .progress-cats { margin: 0; font-size: 13px; color: #4b5563; }
  .progress-empty { margin: 0; color: #6b7280; }

  .filter-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .filter-tabs button {
    padding: 6px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    background: #fff;
    color: #374151;
    font-size: 14px;
    cursor: pointer;
  }
  .filter-tabs button:hover { background: #eff6ff; }
  .filter-tabs button.active { background: #2563eb; border-color: #2563eb; color: #fff; }
</style>
</head>
<body>
<main class="app">
  <h1>할 일 관리</h1>

  <p id="notice" class="notice" role="alert" hidden></p>

  <section id="progress" class="progress" aria-label="진행률"></section>

  <form id="add-form" class="add-form">
    <input id="todo-input" type="text" placeholder="할 일을 입력하세요" maxlength="200"
           autocomplete="off" aria-label="할 일 입력">
    <select id="category-select" aria-label="카테고리">
      <option value="work">업무</option>
      <option value="personal">개인</option>
      <option value="study">공부</option>
    </select>
    <button type="submit">추가</button>
  </form>

  <nav id="filter-tabs" class="filter-tabs" aria-label="카테고리 필터">
    <button type="button" data-filter="all">전체</button>
    <button type="button" data-filter="work">업무</button>
    <button type="button" data-filter="personal">개인</button>
    <button type="button" data-filter="study">공부</button>
  </nav>

  <ul id="todo-list" class="todo-list" aria-label="할 일 목록"></ul>
</main>

<script>
  // 저장 키와 상수
  const STORAGE_KEY = 'todo-app-v1';
  const LAST_CATEGORY_KEY = 'todo-app-v1-last-category';
  const FILTER_KEY = 'todo-app-v1-filter';
  const CATEGORIES = { work: '업무', personal: '개인', study: '공부' };
  const MAX_LENGTH = 200;

  const form = document.getElementById('add-form');
  const input = document.getElementById('todo-input');
  const select = document.getElementById('category-select');
  const listEl = document.getElementById('todo-list');
  const noticeEl = document.getElementById('notice');
  const progressEl = document.getElementById('progress');
  const tabsEl = document.getElementById('filter-tabs');

  let todos = [];
  let currentFilter = 'all';   // 'all' 또는 CATEGORIES의 키
  let editingId = null;        // 지금 수정 중인 항목의 id. 한 번에 하나만 담긴다

  function showNotice(message) {
    noticeEl.textContent = message;
    noticeEl.hidden = false;
  }

  // 저장된 항목이 올바른 모양인지 확인
  function isValidTodo(t) {
    return t !== null && typeof t === 'object'
      && typeof t.id === 'string'
      && typeof t.text === 'string'
      && Object.prototype.hasOwnProperty.call(CATEGORIES, t.category)
      && typeof t.done === 'boolean'
      && typeof t.createdAt === 'number';
  }

  // 불러오기: 실패해도 앱은 빈 목록으로 시작한다
  function loadTodos() {
    let raw;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      showNotice('저장된 데이터를 불러오지 못했습니다');
      return [];
    }
    if (raw === null) return [];
    try {
      const data = JSON.parse(raw);
      if (!Array.isArray(data)) throw new Error('목록 형식이 아님');
      return data.filter(isValidTodo);
    } catch (e) {
      try { localStorage.setItem(STORAGE_KEY + '-broken', raw); } catch (_) { /* 백업 실패는 무시 */ }
      showNotice('저장된 데이터를 불러오지 못했습니다');
      return [];
    }
  }

  function saveTodos() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      showNotice('저장하지 못했습니다. 새로고침하면 방금 한 변경이 사라질 수 있습니다');
    }
  }

  // 지금 필터에 맞는 항목을 그릴 순서로 돌려준다.
  // 미완료가 위, 완료가 아래. 각 묶음 안에서는 배열 순서(최근 추가순)를 유지한다.
  // 정렬은 그릴 때만 적용하고 todos 배열 자체는 바꾸지 않는다.
  function getVisibleTodos() {
    const matched = currentFilter === 'all' ? todos : todos.filter((t) => t.category === currentFilter);
    return [...matched.filter((t) => !t.done), ...matched.filter((t) => t.done)];
  }

  // 진행률: 필터와 관계없이 항상 todos 전체를 기준으로 계산한다 (PRD F7, F8)
  function renderProgress() {
    progressEl.replaceChildren();
    if (todos.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'progress-empty';
      empty.textContent = '할 일을 추가하세요';
      progressEl.appendChild(empty);
      return;
    }
    const total = todos.length;
    const done = todos.filter((t) => t.done).length;
    const percent = Math.round((done / total) * 100);

    const label = document.createElement('div');
    label.className = 'progress-label';
    label.textContent = '완료 ' + done + ' / 전체 ' + total + ' (' + percent + '%)';

    const bar = document.createElement('div');
    bar.className = 'progress-bar';
    bar.setAttribute('role', 'progressbar');
    bar.setAttribute('aria-label', '전체 진행률');
    bar.setAttribute('aria-valuemin', '0');
    bar.setAttribute('aria-valuemax', '100');
    bar.setAttribute('aria-valuenow', String(percent));
    const fill = document.createElement('div');
    fill.className = 'progress-fill';
    fill.style.width = percent + '%';
    bar.appendChild(fill);

    const cats = document.createElement('p');
    cats.className = 'progress-cats';
    cats.textContent = Object.keys(CATEGORIES).map((key) => {
      const inCategory = todos.filter((t) => t.category === key);
      return CATEGORIES[key] + ' ' + inCategory.filter((t) => t.done).length + '/' + inCategory.length;
    }).join(' · ');

    progressEl.append(label, bar, cats);
  }

  // 화면 그리기: 사용자 입력은 textContent로만 넣는다
  function renderList() {
    listEl.replaceChildren();
    const visible = getVisibleTodos();
    if (visible.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = todos.length === 0 ? '할 일을 추가하세요' : '이 분류에는 할 일이 없습니다';
      listEl.appendChild(empty);
      return;
    }
    for (const todo of visible) {
      if (todo.id === editingId) {
        listEl.appendChild(buildEditRow(todo));
        continue;
      }
      const li = document.createElement('li');
      li.dataset.id = todo.id;
      if (todo.done) li.classList.add('done');

      const check = document.createElement('input');
      check.type = 'checkbox';
      check.className = 'todo-check';
      check.checked = todo.done;
      check.dataset.action = 'toggle';
      check.setAttribute('aria-label', todo.text + ' 완료 표시');

      const text = document.createElement('span');
      text.className = 'todo-text';
      text.textContent = todo.text;
      text.title = '더블클릭해서 수정';

      const badge = document.createElement('span');
      badge.className = 'badge ' + todo.category;
      badge.textContent = CATEGORIES[todo.category];

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'delete-btn';
      del.dataset.action = 'delete';
      del.textContent = '삭제';
      del.setAttribute('aria-label', todo.text + ' 삭제');

      li.append(check, text, badge, del);
      listEl.appendChild(li);
    }
  }

  // 수정 중인 항목의 줄: 텍스트 입력칸, 카테고리 선택, 저장·취소 버튼
  function buildEditRow(todo) {
    const li = document.createElement('li');
    li.dataset.id = todo.id;
    li.classList.add('editing');

    const field = document.createElement('input');
    field.type = 'text';
    field.className = 'edit-input';
    field.value = todo.text;
    field.maxLength = MAX_LENGTH;
    field.autocomplete = 'off';
    field.setAttribute('aria-label', '할 일 수정');

    const category = document.createElement('select');
    category.className = 'edit-category';
    category.setAttribute('aria-label', '카테고리 수정');
    for (const key of Object.keys(CATEGORIES)) {
      const option = document.createElement('option');
      option.value = key;
      option.textContent = CATEGORIES[key];
      option.selected = key === todo.category;
      category.appendChild(option);
    }

    const save = document.createElement('button');
    save.type = 'button';
    save.className = 'save-btn';
    save.dataset.action = 'save';
    save.textContent = '저장';

    const cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'cancel-btn';
    cancel.dataset.action = 'cancel';
    cancel.textContent = '취소';

    li.append(field, category, save, cancel);
    return li;
  }

  function render() {
    renderProgress();
    renderList();
  }

  // 필터 탭 표시를 현재 필터에 맞춘다 (탭 버튼은 다시 만들지 않아서 포커스가 유지된다)
  function updateFilterTabs() {
    for (const button of tabsEl.querySelectorAll('button[data-filter]')) {
      const active = button.dataset.filter === currentFilter;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    }
  }

  function isValidFilter(value) {
    return value === 'all' || Object.prototype.hasOwnProperty.call(CATEGORIES, value);
  }

  // 선택한 탭은 새로고침 후에도 유지한다. 저장값이 이상하면 전체로 시작한다
  function loadFilter() {
    try {
      const saved = localStorage.getItem(FILTER_KEY);
      if (saved !== null && isValidFilter(saved)) currentFilter = saved;
    } catch (e) { /* 전체로 시작 */ }
  }

  function setFilter(value) {
    if (!isValidFilter(value)) return;
    editingId = null;   // 수정 중이던 항목이 목록에서 사라질 수 있으니 수정을 닫는다
    currentFilter = value;
    try { localStorage.setItem(FILTER_KEY, value); } catch (e) { /* 저장 실패는 무시 */ }
    updateFilterTabs();
    render();
  }

  // 추가: 성공하면 true
  function addTodo(rawText, category) {
    const text = rawText.trim().slice(0, MAX_LENGTH);
    if (text === '') return false;
    if (!Object.prototype.hasOwnProperty.call(CATEGORIES, category)) return false;
    todos.unshift({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      text,
      category,
      done: false,
      createdAt: Date.now(),
    });
    editingId = null;
    saveTodos();
    render();
    return true;
  }

  // 완료 표시를 뒤집는다
  function toggleTodo(id) {
    const todo = todos.find((t) => t.id === id);
    if (!todo) return;
    editingId = null;
    todo.done = !todo.done;
    saveTodos();
    render();
  }

  // 확인 창 없이 바로 지운다 (PRD F3)
  function deleteTodo(id) {
    const before = todos.length;
    todos = todos.filter((t) => t.id !== id);
    if (todos.length === before) return;
    editingId = null;
    saveTodos();
    render();
  }

  // 수정 시작: editingId 하나로 관리하므로, 다른 항목의 수정을 시작하면 앞의 수정은 저장 없이 닫힌다
  function startEdit(id) {
    if (!todos.some((t) => t.id === id)) return;
    editingId = id;
    render();
    const field = findItem(id) && findItem(id).querySelector('.edit-input');
    if (field) {
      field.focus();
      field.select();
    }
  }

  // 수정 저장: 빈 글이면 저장하지 않고 수정을 취소한다 (PRD F2)
  function saveEdit(id) {
    const row = findItem(id);
    const todo = todos.find((t) => t.id === id);
    if (editingId !== id || !row || !todo) return;
    const text = row.querySelector('.edit-input').value.trim().slice(0, MAX_LENGTH);
    const category = row.querySelector('.edit-category').value;
    editingId = null;
    if (text !== '' && Object.prototype.hasOwnProperty.call(CATEGORIES, category)) {
      todo.text = text;
      todo.category = category;
      saveTodos();
    }
    render();
    focusItem(id);
  }

  function cancelEdit(id) {
    if (editingId !== id) return;
    editingId = null;
    render();
    focusItem(id);
  }

  // 수정을 마친 뒤 키보드 포커스를 그 항목의 체크박스로 돌려준다 (항목이 안 보이면 입력칸)
  function focusItem(id) {
    const item = findItem(id);
    (item ? item.querySelector('[data-action="toggle"]') : input).focus();
  }

  // 마지막에 고른 카테고리를 기억한다
  function loadLastCategory() {
    try {
      const saved = localStorage.getItem(LAST_CATEGORY_KEY);
      if (saved && Object.prototype.hasOwnProperty.call(CATEGORIES, saved)) select.value = saved;
    } catch (e) { /* 기본값 유지 */ }
  }

  function saveLastCategory() {
    try { localStorage.setItem(LAST_CATEGORY_KEY, select.value); } catch (e) { /* 무시 */ }
  }

  // Enter와 추가 버튼은 form 제출 하나로 처리한다 (한글 입력 중 Enter 중복 방지)
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    // 지금 보는 탭에 안 보일 카테고리로 추가하면, 방금 추가한 항목이 사라진 것처럼 보이지 않게 전체 탭으로 돌아간다
    const hiddenByFilter = currentFilter !== 'all' && currentFilter !== select.value;
    if (addTodo(input.value, select.value)) {
      saveLastCategory();
      input.value = '';
      if (hiddenByFilter) setFilter('all');
    }
    input.focus();
  });

  // 필터 탭 클릭도 이벤트 위임 하나로 처리한다
  tabsEl.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-filter]');
    if (!button || !tabsEl.contains(button)) return;
    setFilter(button.dataset.filter);
    // 카테고리 탭을 보는 중이면 새 항목도 그 카테고리로 쌓이게 선택을 맞춘다
    if (button.dataset.filter !== 'all') select.value = button.dataset.filter;
  });

  // 목록 안의 클릭은 <ul> 하나에서 이벤트 위임으로 처리한다 (항목마다 리스너를 붙이지 않는다)
  function findItem(id) {
    return listEl.querySelector('li[data-id="' + CSS.escape(id) + '"]');
  }

  listEl.addEventListener('click', (event) => {
    const target = event.target.closest('[data-action]');
    if (!target || !listEl.contains(target)) return;
    const li = target.closest('li[data-id]');
    if (!li) return;
    const id = li.dataset.id;

    if (target.dataset.action === 'toggle') {
      toggleTodo(id);
      // 다시 그려도 키보드 포커스가 그 항목의 체크박스에 남게 한다
      const item = findItem(id);
      if (item) item.querySelector('[data-action="toggle"]').focus();
    } else if (target.dataset.action === 'save') {
      saveEdit(id);
    } else if (target.dataset.action === 'cancel') {
      cancelEdit(id);
    } else if (target.dataset.action === 'delete') {
      // 지운 뒤 포커스를 이어 갈 항목(다음, 없으면 이전)을 미리 정해 둔다
      const neighbor = li.nextElementSibling || li.previousElementSibling;
      const neighborId = neighbor && neighbor.dataset.id;
      deleteTodo(id);
      const next = neighborId ? findItem(neighborId) : null;
      (next ? next.querySelector('[data-action="delete"]') : input).focus();
    }
  });

  // 더블클릭으로 수정 시작 (같은 <ul>에서 처리한다)
  listEl.addEventListener('dblclick', (event) => {
    const textEl = event.target.closest('.todo-text');
    if (!textEl || !listEl.contains(textEl)) return;
    const li = textEl.closest('li[data-id]');
    if (li) startEdit(li.dataset.id);
  });

  // 수정 중 키보드: 입력칸에서 Enter는 저장, 수정 줄 어디서든 Esc는 취소
  listEl.addEventListener('keydown', (event) => {
    const row = event.target.closest('li.editing');
    if (!row) return;
    const id = row.dataset.id;
    if (event.key === 'Escape') {
      event.preventDefault();
      cancelEdit(id);
    } else if (event.key === 'Enter' && event.target.matches('.edit-input')
               && !event.isComposing && event.keyCode !== 229) {
      // 한글 조합이 끝나기 전의 Enter(isComposing)는 저장으로 처리하지 않는다
      event.preventDefault();
      saveEdit(id);
    }
  });

  todos = loadTodos();
  loadLastCategory();
  loadFilter();
  if (currentFilter !== 'all') select.value = currentFilter;
  updateFilterTabs();
  render();
</script>
</body>
</html>
